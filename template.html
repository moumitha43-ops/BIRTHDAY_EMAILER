<h1 class="title">Happy Birthday</h1>
<div class="body">
  <p class="p salute">My Dear <span class="bold">{{name}}</span></p>
  <p class="p">I have great pleasure in conveying my best<br>wishes on the eve of your birthday</p>
  <p class="p">My prayers are to Lord Bannari Amman<br>to bless you with peace, prosperity and<br>happiness</p>
  <p class="p" style="margin-top:17px;margin-bottom:0;">Yours Sincerely</p>
